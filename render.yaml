# Blueprint для Render: фоновый сервис с ботом + база PostgreSQL.
# BOT_TOKEN Render спросит при создании (sync: false), в репозиторий он не попадает.
services:
  - type: worker
    name: repbot
    runtime: docker
    dockerfilePath: ./Dockerfile
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_IDS
        value: "1457986905"
      - key: DATABASE_URL
        fromDatabase:
          name: repbot-db
          property: connectionString

databases:
  - name: repbot-db
